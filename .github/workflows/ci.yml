name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run current-version tests
        run: pytest
      - name: Run frozen lesson tests in isolated processes
        run: python scripts/run_lesson_tests.py --timeout-seconds 120

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Verify lessons from the built source distribution
        shell: bash
        run: |
          set -euo pipefail
          sdist_path=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          extract_dir=$(mktemp -d)
          tar -xzf "$sdist_path" -C "$extract_dir"
          package_dir=$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)
          python "$package_dir/scripts/run_lesson_tests.py" \
            --lessons-dir "$package_dir/lessons" \
            --timeout-seconds 120
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
